name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop/**', 'agent_sidecar/**', 'tests/test_desktop.py', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2t64 rpm
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: python -m pip install -r desktop/requirements-build.txt
      - run: python -m unittest tests.test_desktop -v
      - run: npm run dist
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke-test frozen backend
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python desktop/scripts/check_backend.py desktop/backend-dist/SidecarBackend/SidecarBackend.exe
          else
            python desktop/scripts/check_backend.py desktop/backend-dist/SidecarBackend/SidecarBackend
          fi
      - name: Smoke-test desktop window
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo chown root:root desktop/release/linux-unpacked/chrome-sandbox
            sudo chmod 4755 desktop/release/linux-unpacked/chrome-sandbox
            xvfb-run -a npm --prefix desktop run smoke
          else
            npm --prefix desktop run smoke
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Sidecar-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*smoke*.json
            desktop/release/SHA256SUMS
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diagnostics-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            desktop/release/builder-debug.yml
            desktop/backend-build/backend/warn-backend.txt
