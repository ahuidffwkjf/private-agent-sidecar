name: Verified Toy desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop/**', 'agent_sidecar/**', 'tests/test_desktop.py', 'tests/test_toy_desktop.py', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.id }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, id: windows-x64, arch: x64}
          - {os: ubuntu-22.04, id: linux-x64, arch: x64}
          - {os: macos-15, id: macos-arm64, arch: arm64}
          - {os: macos-15-intel, id: macos-x64, arch: x64}
    runs-on: ${{ matrix.os }}
    env:
      NO_PROXY: 127.0.0.1,localhost,::1
      no_proxy: 127.0.0.1,localhost,::1
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 rpm xvfb libgtk-3-0 libnss3 libasound2 libgbm1
      - name: Verify native architecture
        run: node -e "if(process.arch!=='${{ matrix.arch }}')process.exit(1);console.log(process.platform,process.arch)"
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: python -m pip install -r desktop/requirements-build.txt
      - run: python -m unittest discover -s tests -p test_desktop.py -v
      - run: python -m unittest discover -s tests -p test_toy_desktop.py -v
      - run: npm run dist
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke-test frozen backend
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python desktop/scripts/check_backend.py desktop/backend-dist/SidecarBackend/SidecarBackend.exe
            python desktop/scripts/check_toy_backend.py desktop/backend-dist/SidecarBackend/SidecarBackend.exe
          else
            python desktop/scripts/check_backend.py desktop/backend-dist/SidecarBackend/SidecarBackend
            python desktop/scripts/check_toy_backend.py desktop/backend-dist/SidecarBackend/SidecarBackend
          fi
      - name: Smoke-test desktop window
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo chown root:root desktop/release/linux-unpacked/chrome-sandbox
            sudo chmod 4755 desktop/release/linux-unpacked/chrome-sandbox
            xvfb-run -a npm --prefix desktop run smoke
          else
            npm --prefix desktop run smoke
          fi
      - name: Test downloaded and installed packages
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node desktop/scripts/verify-download.cjs
          else
            node desktop/scripts/verify-download.cjs
          fi
      - name: Collect only verified distributables
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path('desktop/release')
          output = pathlib.Path('desktop/publish')
          output.mkdir()
          version = json.loads(pathlib.Path('desktop/package.json').read_text())['version']
          validation = json.loads((root/'download-validation.json').read_text())
          assert validation['status'] == 'passed'
          assets = [p for p in root.iterdir() if p.is_file() and p.name.startswith('Sidecar-Toy-'+version+'-') and p.suffix in {'.dmg','.zip','.exe','.AppImage','.deb'}]
          assert len(assets) == 2, [p.name for p in assets]
          checksums = {}
          for path in assets:
              shutil.copy2(path,output/path.name)
              checksums[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          result = {'source_commit':os.environ['GITHUB_SHA'],'runner':'${{ matrix.os }}','checksums':checksums,'download_validation':validation,'native_smoke':json.loads((root/'toy-desktop-smoke.json').read_text())}
          (output/'validation-${{ matrix.id }}.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Sidecar-${{ matrix.id }}
          if-no-files-found: error
          path: desktop/publish/*
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diagnostics-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            desktop/release/builder-debug.yml
            desktop/backend-build/backend/warn-backend.txt
            desktop/release/**/*smoke*.json
  publish:
    name: Publish only after all four native validations
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Sidecar-*
          path: release-assets
          merge-multiple: true
      - name: Verify matrix outputs and create checksums
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, shutil
          root = pathlib.Path('release-assets')
          expected = {'windows-x64','linux-x64','macos-arm64','macos-x64'}
          found = set()
          for path in root.glob('validation-*.json'):
              found.add(path.stem.removeprefix('validation-'))
              result = json.loads(path.read_text())
              assert result['download_validation']['status'] == 'passed'
              for name, digest in result['checksums'].items():
                  assert hashlib.sha256((root/name).read_bytes()).hexdigest() == digest
          assert found == expected, found
          packages = sorted(p for p in root.iterdir() if p.suffix in {'.dmg','.zip','.exe','.AppImage','.deb'})
          assert len(packages) == 8
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in packages))
          shutil.copy2('docs/TOY_CROSS_PLATFORM_GUIDE.md', root/'Sidecar-Toy-Download-Guide.zh-CN.md')
          PY
      - name: Publish verified preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --prerelease --title "Sidecar Toy 0.3.2 · Windows / Linux / macOS" --notes-file docs/TOY_CROSS_PLATFORM_RELEASE.md
