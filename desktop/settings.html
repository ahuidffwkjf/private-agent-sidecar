<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; connect-src 'none'"><title>连接设置</title><link rel="stylesheet" href="settings.css"><script defer src="settings.js"></script></head>
<body><h1>连接设置</h1><form id="settings"><fieldset id="connection-fields" disabled><label><input type="radio" name="mode" value="local" checked> 本机 Toy 工作区</label><p>内置 Alice、Bob、Carol、Dave 四个演示用户，数据保存在此电脑。各用户独立确认实验采集后参与任务。</p><label><input type="radio" name="mode" value="remote"> 现有 Sidecar 服务</label><input id="url" type="url" aria-label="Sidecar 服务地址" placeholder="https://sidecar.example.com" disabled><p>跨机器连接需要 HTTPS。请输入已部署的 Sidecar 服务地址，不是 Relay 地址；不要在地址中填写密钥或密码。</p><div class="actions"><button id="save">保存并重新启动</button></div></fieldset><p id="error" role="alert"></p></form></body></html>
